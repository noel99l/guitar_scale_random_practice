<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>指板スケール練習ランダム表示</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 760px;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .header {
      margin-bottom: 24px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 5vw, 36px);
      letter-spacing: 0.04em;
    }

    .header p {
      margin: 0;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.7;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 18px 14px;
      text-align: center;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .label {
      color: #93c5fd;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 0.08em;
    }

    .value {
      font-size: clamp(24px, 5vw, 38px);
      font-weight: 800;
      line-height: 1.2;
      word-break: keep-all;
    }

    .degree .value,
    .finger .value {
      font-size: clamp(20px, 4vw, 30px);
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
      opacity: 0.85;
    }

    .primary {
      background: #60a5fa;
      color: #0f172a;
    }

    .secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #f9fafb;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    details.settings {
      margin-bottom: 16px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 16px;
      padding: 12px 16px;
    }

    details.settings summary {
      font-size: 13px;
      font-weight: 700;
      color: #93c5fd;
      cursor: pointer;
      letter-spacing: 0.06em;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    details.settings summary::before {
      content: '▶';
      font-size: 10px;
      transition: transform 0.2s;
    }

    details.settings[open] summary::before {
      transform: rotate(90deg);
    }

    details.settings .settings-inner {
      margin-top: 12px;
    }

    .scale-preset {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .scale-preset label {
      font-size: 12px;
      font-weight: 700;
      color: #93c5fd;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .scale-preset select {
      background: rgba(255,255,255,0.08);
      color: #f9fafb;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .toggle-section {
      margin-bottom: 16px;
    }

    .toggle-section-label {
      font-size: 12px;
      font-weight: 700;
      color: #93c5fd;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .toggle-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .toggle-group button {
      background: rgba(255, 255, 255, 0.10);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 7px 13px;
      font-size: 13px;
      font-weight: 600;
    }

    .toggle-group button.active {
      background: #60a5fa;
      color: #0f172a;
      border-color: #60a5fa;
    }

    .degree-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      overflow: hidden;
    }

    .degree-grid-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      padding: 10px 4px;
      border-right: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      min-height: 72px;
    }

    .degree-grid-cell:last-child {
      border-right: none;
    }

    .degree-grid-cell span {
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.3;
      word-break: break-all;
    }

    .degree-grid-cell input[type=checkbox] {
      width: 16px;
      height: 16px;
      accent-color: #60a5fa;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .degree-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    .hint {
      text-align: center;
      color: #cbd5e1;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .timer {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      color: #f9fafb;
      margin: 0 0 18px;
      letter-spacing: 0.04em;
    }

    .history {
      background: rgba(0, 0, 0, 0.22);
      border-radius: 16px;
      padding: 16px;
      max-height: 220px;
      overflow: auto;
    }

    .history h2 {
      margin: 0 0 10px;
      font-size: 15px;
      color: #e5e7eb;
    }

    .history ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .history li {
      color: #d1d5db;
      font-size: 14px;
      line-height: 1.5;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .history-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
      flex: 1;
      min-width: 0;
    }

    .history-item-label {
      font-size: 9px;
      color: #93c5fd;
      font-weight: 700;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .history-item-value {
      font-size: 11px;
      color: #f9fafb;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .history-time {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      color: #60a5fa;
      white-space: nowrap;
      padding-left: 4px;
    }

    .footer {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #9ca3af;
    }

    .footer a {
      color: #60a5fa;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .empty {
      color: #9ca3af;
      font-size: 14px;
      margin: 0;
    }

    @media (max-width: 680px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 420px) {
      .app {
        padding: 20px;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <h1>指板スケール練習</h1>
      <p>スケール・弦・度数・指をランダム表示します。表示された条件から指板上で音を探して練習してください。</p>
    </section>

    <section class="cards" aria-live="polite">
      <div class="card">
        <div class="label">ルート</div>
        <div id="scale" class="value">-</div>
      </div>
      <div class="card degree">
        <div class="label">度数</div>
        <div id="degree" class="value">-</div>
      </div>
      <div class="card">
        <div class="label">弦</div>
        <div id="string" class="value">-</div>
      </div>
      <div class="card finger">
        <div class="label">指</div>
        <div id="finger" class="value">-</div>
      </div>
    </section>

    <p class="timer" id="timer">0.0s</p>

    <section class="actions">
      <button class="primary" type="button" onclick="drawPractice()">ランダム表示</button>
      <button class="secondary" type="button" onclick="clearHistory()">履歴クリア</button>
    </section>

    <details class="settings">
      <summary>設定</summary>
      <div class="settings-inner">
        <div class="toggle-section">
          <div class="toggle-section-label">ルート</div>
          <div class="degree-grid" id="scaleGrid"></div>
        </div>
        <div class="toggle-section">
          <div class="toggle-section-label">弦</div>
          <div class="degree-grid" id="stringGrid"></div>
        </div>
        <div class="toggle-section">
          <div class="toggle-section-label">度数</div>
          <div class="scale-preset">
            <label>スケール：</label>
            <select id="scalePreset" onchange="applyScalePreset(this.value)">
              <option value="">―― プリセット ――</option>
              <option value="ionian">Ionian (Major)</option>
              <option value="dorian">Dorian</option>
              <option value="phrygian">Phrygian</option>
              <option value="lydian">Lydian</option>
              <option value="mixolydian">Mixolydian</option>
              <option value="aeolian">Aeolian (Natural Minor)</option>
              <option value="locrian">Locrian</option>
              <option value="majorPenta">Major Pentatonic</option>
              <option value="minorPenta">Minor Pentatonic</option>
              <option value="harmonicMinor">Harmonic Minor</option>
              <option value="melodicMinor">Melodic Minor</option>
              <option value="altered">Altered</option>
              <option value="wholeTone">Whole Tone</option>
              <option value="comboDimi">Combination Diminished</option>
              <option value="diminished">Diminished</option>
              <option value="lydianb7">Lydian b7</option>
              <option value="chromatic">Chromatic</option>
            </select>
          </div>
          <div class="degree-grid" id="degreeGrid"></div>
        </div>
        <div class="toggle-section">
          <div class="toggle-section-label">指</div>
          <div class="degree-grid" id="fingerGrid"></div>
        </div>
      </div>
    </details>

    <p class="hint">ショートカット：スペースキーでもランダム表示できます。</p>

    <section class="history">
      <h2>履歴</h2>
      <ul id="historyList"></ul>
      <p id="emptyHistory" class="empty">まだ履歴はありません。</p>
    </section>

    <p class="footer">開発/お問い合わせ： X <a href="https://x.com/noel99l" target="_blank">@noel99l</a></p>
  </main>

  <script>
    const groups = {
      scale:  { all: ["C","C#/D♭","D","D#/E♭","E","F","F#/G♭","G","G#/A♭","A","A#/B♭","B"], active: new Set(["C","C#/D♭","D","D#/E♭","E","F","F#/G♭","G","G#/A♭","A","A#/B♭","B"]) },
      string: { all: ["1弦","2弦","3弦","4弦","5弦","6弦","7弦"], active: new Set(["1弦","2弦","3弦","4弦","5弦","6弦"]) },
      degree: { all: ["Root","♭9th","9th","m3rd(#9th)","M3rd","4th(11th)","#11th(♭5)","5th","♭13th(#5th)","6th(13th)","m7th","M7th"], active: new Set(["Root","9th","M3rd","4th(11th)","5th","6th(13th)","M7th"]) },
      finger: { all: ["人差し指","中指","薬指","小指"], active: new Set(["人差し指","中指","薬指","小指"]) },
    };

    const scaleEl = document.getElementById("scale");
    const stringEl = document.getElementById("string");
    const degreeEl = document.getElementById("degree");
    const fingerEl = document.getElementById("finger");
    const historyList = document.getElementById("historyList");
    const emptyHistory = document.getElementById("emptyHistory");

    const scalePresets = {
      ionian:        ["Root","9th","M3rd","4th(11th)","5th","6th(13th)","M7th"],
      dorian:        ["Root","9th","m3rd(#9th)","4th(11th)","5th","6th(13th)","m7th"],
      phrygian:      ["Root","♭9th","m3rd(#9th)","4th(11th)","5th","♭13th(#5th)","m7th"],
      lydian:        ["Root","9th","M3rd","#11th(♭5)","5th","6th(13th)","M7th"],
      mixolydian:    ["Root","9th","M3rd","4th(11th)","5th","6th(13th)","m7th"],
      aeolian:       ["Root","9th","m3rd(#9th)","4th(11th)","5th","♭13th(#5th)","m7th"],
      locrian:       ["Root","♭9th","m3rd(#9th)","4th(11th)","#11th(♭5)","♭13th(#5th)","m7th"],
      majorPenta:    ["Root","9th","M3rd","5th","6th(13th)"],
      minorPenta:    ["Root","m3rd(#9th)","4th(11th)","5th","m7th"],
      harmonicMinor: ["Root","9th","m3rd(#9th)","4th(11th)","5th","♭13th(#5th)","M7th"],
      melodicMinor:  ["Root","9th","m3rd(#9th)","4th(11th)","5th","6th(13th)","M7th"],
      altered:        ["Root","♭9th","m3rd(#9th)","M3rd","#11th(♭5)","♭13th(#5th)","m7th"],
      wholeTone:     ["Root","9th","M3rd","#11th(♭5)","♭13th(#5th)","m7th"],
      comboDimi:     ["Root","♭9th","m3rd(#9th)","M3rd","#11th(♭5)","5th","6th(13th)","m7th"],
      diminished:    ["Root","♭9th","m3rd(#9th)","M3rd","#11th(♭5)","5th","♭13th(#5th)","M7th"],
      lydianb7:      ["Root","9th","M3rd","#11th(♭5)","5th","6th(13th)","m7th"],
      chromatic:     ["Root","♭9th","9th","m3rd(#9th)","M3rd","4th(11th)","#11th(♭5)","5th","♭13th(#5th)","6th(13th)","m7th","M7th"],
    };

    function applyScalePreset(key) {
      if (!key) return;
      const preset = new Set(scalePresets[key]);
      groups.degree.active = new Set(preset);
      document.querySelectorAll("#degreeGrid input[type=checkbox]").forEach(cb => {
        cb.checked = preset.has(cb.dataset.item);
      });
    }

    function buildToggles() {
      ["scale", "string", "degree", "finger"].forEach(key => {
        const grid = document.getElementById(key + "Grid");
        const g = groups[key];
        g.all.forEach(item => {
          const cell = document.createElement("div");
          cell.className = "degree-grid-cell";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = g.active.has(item);
          cb.dataset.item = item;
          cb.addEventListener("change", () => {
            if (!cb.checked && g.active.size === 1) { cb.checked = true; return; }
            cb.checked ? g.active.add(item) : g.active.delete(item);
            if (key === "degree") document.getElementById("scalePreset").value = "";
          });
          const label = document.createElement("span");
          label.innerHTML = item.replace("(", "<br>(");
          cell.appendChild(cb);
          cell.appendChild(label);
          grid.appendChild(cell);
        });
      });
    }

    function pickRandom(set) {
      const arr = [...set];
      return arr[Math.floor(Math.random() * arr.length)];
    }

    const timerEl = document.getElementById("timer");
    let timerStart = null;
    let timerInterval = null;

    function startTimer() {
      clearInterval(timerInterval);
      timerStart = Date.now();
      timerInterval = setInterval(() => {
        timerEl.textContent = ((Date.now() - timerStart) / 1000).toFixed(2) + "s";
      }, 10);
    }

    function drawPractice() {
      const elapsed = timerStart !== null
        ? ((Date.now() - timerStart) / 1000).toFixed(2) + "s"
        : null;

      const result = {
        scale:  pickRandom(groups.scale.active),
        string: pickRandom(groups.string.active),
        degree: pickRandom(groups.degree.active),
        finger: pickRandom(groups.finger.active),
      };

      scaleEl.textContent = result.scale;
      stringEl.textContent = result.string;
      degreeEl.textContent = result.degree;
      fingerEl.textContent = result.finger;

      if (elapsed) addHistory(result, elapsed);
      startTimer();
    }

    function addHistory(result, elapsed) {
      emptyHistory.style.display = "none";
      const li = document.createElement("li");
      const items = [
        { label: "ルート", value: result.scale },
        { label: "弦",     value: result.string },
        { label: "度数",   value: result.degree },
        { label: "指",     value: result.finger },
      ];
      items.forEach(({ label, value }) => {
        const el = document.createElement("div");
        el.className = "history-item";
        el.innerHTML = `<span class="history-item-label">${label}</span><span class="history-item-value">${value}</span>`;
        li.appendChild(el);
      });
      const time = document.createElement("span");
      time.className = "history-time";
      time.textContent = elapsed;
      li.appendChild(time);
      historyList.prepend(li);
      while (historyList.children.length > 10) {
        historyList.removeChild(historyList.lastChild);
      }
    }

    function clearHistory() {
      historyList.innerHTML = "";
      emptyHistory.style.display = "block";
    }

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        drawPractice();
      }
    });

    buildToggles();
    drawPractice();
  </script>
</body>
</html>
