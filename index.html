<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>指板スケール練習ランダム表示</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 760px;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .header {
      margin-bottom: 24px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 5vw, 36px);
      letter-spacing: 0.04em;
    }

    .header p {
      margin: 0;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.7;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 18px 14px;
      text-align: center;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .label {
      color: #93c5fd;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 0.08em;
    }

    .value {
      font-size: clamp(24px, 5vw, 38px);
      font-weight: 800;
      line-height: 1.2;
      word-break: keep-all;
    }

    .degree .value,
    .finger .value {
      font-size: clamp(20px, 4vw, 30px);
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
      opacity: 0.85;
    }

    .primary {
      background: #60a5fa;
      color: #0f172a;
    }

    .secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #f9fafb;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    details.settings {
      margin-bottom: 16px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 16px;
      padding: 12px 16px;
    }

    details.settings summary {
      font-size: 13px;
      font-weight: 700;
      color: #93c5fd;
      cursor: pointer;
      letter-spacing: 0.06em;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    details.settings summary::before {
      content: '▶';
      font-size: 10px;
      transition: transform 0.2s;
    }

    details.settings[open] summary::before {
      transform: rotate(90deg);
    }

    details.settings .settings-inner {
      margin-top: 12px;
    }

    .toggle-section {
      margin-bottom: 16px;
    }

    .toggle-section-label {
      font-size: 12px;
      font-weight: 700;
      color: #93c5fd;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .toggle-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .toggle-group button {
      background: rgba(255, 255, 255, 0.10);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 7px 13px;
      font-size: 13px;
      font-weight: 600;
    }

    .toggle-group button.active {
      background: #60a5fa;
      color: #0f172a;
      border-color: #60a5fa;
    }

    .hint {
      text-align: center;
      color: #cbd5e1;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .timer {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      color: #f9fafb;
      margin: 0 0 18px;
      letter-spacing: 0.04em;
    }

    .history {
      background: rgba(0, 0, 0, 0.22);
      border-radius: 16px;
      padding: 16px;
      max-height: 220px;
      overflow: auto;
    }

    .history h2 {
      margin: 0 0 10px;
      font-size: 15px;
      color: #e5e7eb;
    }

    .history ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .history li {
      color: #d1d5db;
      font-size: 14px;
      line-height: 1.5;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 10px;
    }

    .empty {
      color: #9ca3af;
      font-size: 14px;
      margin: 0;
    }

    @media (max-width: 680px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 420px) {
      .app {
        padding: 20px;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <h1>指板スケール練習</h1>
      <p>スケール・弦・度数・指をランダム表示します。表示された条件から指板上で音を探して練習してください。</p>
    </section>

    <section class="cards" aria-live="polite">
      <div class="card">
        <div class="label">スケール</div>
        <div id="scale" class="value">-</div>
      </div>
      <div class="card degree">
        <div class="label">度数</div>
        <div id="degree" class="value">-</div>
      </div>
      <div class="card">
        <div class="label">弦</div>
        <div id="string" class="value">-</div>
      </div>
      <div class="card finger">
        <div class="label">指</div>
        <div id="finger" class="value">-</div>
      </div>
    </section>

    <p class="timer" id="timer">0.0s</p>

    <section class="actions">
      <button class="primary" type="button" onclick="drawPractice()">ランダム表示</button>
      <button class="secondary" type="button" onclick="clearHistory()">履歴クリア</button>
    </section>

    <details class="settings">
      <summary>設定</summary>
      <div class="settings-inner">
        <div class="toggle-section">
          <div class="toggle-section-label">スケール</div>
          <div class="toggle-group" id="scaleToggle"></div>
        </div>
        <div class="toggle-section">
          <div class="toggle-section-label">弦</div>
          <div class="toggle-group" id="stringToggle"></div>
        </div>
        <div class="toggle-section">
          <div class="toggle-section-label">度数</div>
          <div class="toggle-group" id="degreeToggle"></div>
        </div>
        <div class="toggle-section">
          <div class="toggle-section-label">指</div>
          <div class="toggle-group" id="fingerToggle"></div>
        </div>
      </div>
    </details>

    <p class="hint">ショートカット：スペースキーでもランダム表示できます。</p>

    <section class="history">
      <h2>履歴</h2>
      <ul id="historyList"></ul>
      <p id="emptyHistory" class="empty">まだ履歴はありません。</p>
    </section>
  </main>

  <script>
    const groups = {
      scale:  { all: ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"], active: new Set(["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"]) },
      string: { all: ["1弦","2弦","3弦","4弦","5弦","6弦","7弦"], active: new Set(["1弦","2弦","3弦","4弦","5弦","6弦"]) },
      degree: { all: ["Root","♭9th","9th","m3rd(#9th)","M3rd","4th(11th)","#11th(♭5)","5th","♭13th(#5th)","6th(13th)","m7th","M7th"], active: new Set(["Root","9th","M3rd","4th(11th)","5th","6th(13th)","M7th"]) },
      finger: { all: ["人差し指","中指","薬指","小指"], active: new Set(["人差し指","中指","薬指","小指"]) },
    };

    const scaleEl = document.getElementById("scale");
    const stringEl = document.getElementById("string");
    const degreeEl = document.getElementById("degree");
    const fingerEl = document.getElementById("finger");
    const historyList = document.getElementById("historyList");
    const emptyHistory = document.getElementById("emptyHistory");

    function buildToggles() {
      Object.entries(groups).forEach(([key, g]) => {
        const container = document.getElementById(key + "Toggle");
        g.all.forEach(item => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = item;
          if (g.active.has(item)) btn.classList.add("active");
          btn.addEventListener("click", () => {
            if (g.active.has(item)) {
              if (g.active.size === 1) return;
              g.active.delete(item);
              btn.classList.remove("active");
            } else {
              g.active.add(item);
              btn.classList.add("active");
            }
          });
          container.appendChild(btn);
        });
      });
    }

    function pickRandom(set) {
      const arr = [...set];
      return arr[Math.floor(Math.random() * arr.length)];
    }

    const timerEl = document.getElementById("timer");
    let timerStart = null;
    let timerInterval = null;

    function startTimer() {
      clearInterval(timerInterval);
      timerStart = Date.now();
      timerInterval = setInterval(() => {
        timerEl.textContent = ((Date.now() - timerStart) / 1000).toFixed(2) + "s";
      }, 10);
    }

    function drawPractice() {
      const elapsed = timerStart !== null
        ? ((Date.now() - timerStart) / 1000).toFixed(2) + "s"
        : null;

      const result = {
        scale:  pickRandom(groups.scale.active),
        string: pickRandom(groups.string.active),
        degree: pickRandom(groups.degree.active),
        finger: pickRandom(groups.finger.active),
      };

      scaleEl.textContent = result.scale;
      stringEl.textContent = result.string;
      degreeEl.textContent = result.degree;
      fingerEl.textContent = result.finger;

      if (elapsed) addHistory(result, elapsed);
      startTimer();
    }

    function addHistory(result, elapsed) {
      emptyHistory.style.display = "none";
      const li = document.createElement("li");
      li.textContent = `${result.scale} / ${result.string} / ${result.degree} / ${result.finger}  [${elapsed}]`;
      historyList.prepend(li);
      while (historyList.children.length > 10) {
        historyList.removeChild(historyList.lastChild);
      }
    }

    function clearHistory() {
      historyList.innerHTML = "";
      emptyHistory.style.display = "block";
    }

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        drawPractice();
      }
    });

    buildToggles();
    drawPractice();
  </script>
</body>
</html>
